version: 2
updates:
- package-ecosystem: uv
  directory: /
  target-branch: main
  schedule:
    interval: daily
  cooldown:
    default-days: 2
  open-pull-requests-limit: 10
  labels: [dependencies, python]
  commit-message:
    prefix: uv
    include: scope
  rebase-strategy: auto

- package-ecosystem: github-actions
  directory: /
  target-branch: main
  schedule:
    interval: daily
  cooldown:
    default-days: 2
  open-pull-requests-limit: 10
  labels: [dependencies, github-actions]
  commit-message:
    prefix: github-actions
    include: scope
  rebase-strategy: auto
